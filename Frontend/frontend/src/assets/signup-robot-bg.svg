<svg viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1b1440"/>
      <stop offset="60%" stop-color="#0d0b24"/>
      <stop offset="100%" stop-color="#060512"/>
    </radialGradient>
    <linearGradient id="botBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b2560"/>
      <stop offset="100%" stop-color="#171335"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="800" height="900" fill="url(#bgGlow)"/>

  <!-- soft floating orbs -->
  <circle cx="120" cy="150" r="90" fill="#6d28d9" opacity="0.18" filter="url(#softBlur)"/>
  <circle cx="700" cy="700" r="140" fill="#14b8a6" opacity="0.15" filter="url(#softBlur)"/>
  <circle cx="650" cy="120" r="70" fill="#818cf8" opacity="0.15" filter="url(#softBlur)"/>

  <!-- circuit lines -->
  <g stroke="#4c4a8a" stroke-width="1.5" opacity="0.35" fill="none">
    <path d="M60 400 H180 V320"/>
    <path d="M60 500 H150"/>
    <path d="M740 400 H620 V500"/>
    <path d="M740 300 H660"/>
    <circle cx="180" cy="320" r="4" fill="#818cf8" stroke="none"/>
    <circle cx="620" cy="500" r="4" fill="#5eead4" stroke="none"/>
    <circle cx="660" cy="300" r="4" fill="#818cf8" stroke="none"/>
  </g>

  <!-- antenna -->
  <line x1="400" y1="210" x2="400" y2="160" stroke="url(#neonBlue)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="400" cy="150" r="10" fill="url(#neonBlue)" filter="url(#glow)"/>

  <!-- head -->
  <rect x="290" y="210" width="220" height="170" rx="36" fill="url(#botBody)" stroke="url(#neonBlue)" stroke-width="3"/>
  <!-- eyes -->
  <ellipse cx="360" cy="295" rx="18" ry="24" fill="url(#neonBlue)" filter="url(#glow)"/>
  <ellipse cx="440" cy="295" rx="18" ry="24" fill="url(#neonBlue)" filter="url(#glow)"/>
  <!-- mouth -->
  <rect x="355" y="335" width="90" height="8" rx="4" fill="#5eead4" opacity="0.8"/>

  <!-- neck -->
  <rect x="375" y="380" width="50" height="24" fill="#232057"/>

  <!-- body -->
  <rect x="250" y="404" width="300" height="260" rx="40" fill="url(#botBody)" stroke="url(#neonBlue)" stroke-width="3"/>
  <!-- chest panel -->
  <rect x="330" y="450" width="140" height="90" rx="16" fill="#0d0b24" stroke="#5eead4" stroke-width="2" opacity="0.9"/>
  <circle cx="400" cy="495" r="26" fill="none" stroke="url(#neonBlue)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="400" cy="495" r="8" fill="url(#neonBlue)" filter="url(#glow)"/>

  <!-- side buttons -->
  <circle cx="290" cy="600" r="10" fill="#5eead4" opacity="0.8"/>
  <circle cx="510" cy="600" r="10" fill="#818cf8" opacity="0.8"/>

  <!-- arms -->
  <rect x="190" y="430" width="55" height="150" rx="26" fill="url(#botBody)" stroke="url(#neonBlue)" stroke-width="2.5"/>
  <rect x="555" y="430" width="55" height="150" rx="26" fill="url(#botBody)" stroke="url(#neonBlue)" stroke-width="2.5"/>
  <circle cx="217" cy="595" r="22" fill="url(#botBody)" stroke="url(#neonBlue)" stroke-width="2.5"/>
  <circle cx="583" cy="595" r="22" fill="url(#botBody)" stroke="url(#neonBlue)" stroke-width="2.5"/>

  <!-- ground shadow -->
  <ellipse cx="400" cy="700" rx="180" ry="22" fill="#000" opacity="0.35" filter="url(#softBlur)"/>
</svg>
